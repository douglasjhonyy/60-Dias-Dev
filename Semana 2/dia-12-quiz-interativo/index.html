<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Interativo - JavaScript Master</title>
</head>
<body>
    <!--Tela inicial-->
    <div id="tela-inicial" class="tela active">
        <div class="container">
            <div class="hero">
                <h1>Quiz Interativo</h1>
                <p>Teste seus conhecimentos em Javascript</p>
            </div>

            <div class="card">
                <h2>Escolha a categoria</h2>
                <div class="categoria">
                    <button class="btn-categoria" data-categoria="javascript">Javascript</button>
                    <button class="btn-categoria" data-categoria="html">HTML</button>
                    <button class="btn-categoria" data-categoria="css">CSS</button>
                    <button class="btn-categoria" data-categoria="geral">Conhecimentos Gerais</button>
                </div>

                <div class="dificuldade-section">
                    <h3>Dificuldades</h3>
                    <div class="dificuldades">
                        <button class="btn-dificuldade active" data-dificuldade="facil">Fácil</button>
                        <button class="btn-dificuldade" data-dificuldade="medio">Médio</button>
                        <button class="btn-dificuldade" data-dificuldade="dificil">Difícil</button>
                    </div>
                </div>

                <button id="btn-iniciar" class="btn btn-primary btn-large">Iniciar Quiz</button>
            </div>

            <!--Ranking-->
            <div class="card">
                <h2>🏆 Ranking Top 5</h2>
                <div id="ranking-lista" class="ranking-lista"></div>
            </div>

        </div>
    </div>

    <!--Tela do Quiz-->
</body>
</html>
