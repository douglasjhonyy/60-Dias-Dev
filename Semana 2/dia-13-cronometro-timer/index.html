<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Pro</title>
</head>
<body>
    <div class="container">
        <!--Header-->
        <header class="header">
            <h1>Timer Pro</h1>
            <div class="header-controls">
                <button id="btn-theme" class="btn-icon" title="Alternar Tema">🌙</button>
                <button id="btn-notif" class="btn-icon" title="Ativar notificações">🔔</button>
            </div>
        </header>

        <!--Tabs-->

        <div class="tabs">
            <button class="tab active" data-tab="cronometro">⏱️ Cronômetro</button>
            <button class="tab" data-tab="timer">⏲️ Timer</button>
            <button class="tab" data-tab="pomodoro">🍅 Pomodoro</button>
            <button class="tab" data-tab="relogio">🌍 Relógio</button>
        </div>
    </div>
</body>
</html>
