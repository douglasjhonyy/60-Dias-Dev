<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Pro</title>
</head>
<body>
    <div class="container">
        <!--Header-->
        <header class="header">
            <h1>Timer Pro</h1>
            <div class="header-controls">
                <button id="btn-theme" class="btn-icon" title="Alternar Tema">🌙</button>
                <button id="btn-notif" class="btn-icon" title="Ativar notificações">🔔</button>
            </div>
        </header>

        <!--Tabs-->

        <div class="tabs">
            <button class="tab active" data-tab="cronometro">⏱️ Cronômetro</button>
            <button class="tab" data-tab="timer">⏲️ Timer</button>
            <button class="tab" data-tab="pomodoro">🍅 Pomodoro</button>
            <button class="tab" data-tab="relogio">🌍 Relógio</button>
        </div>

        <!--Tela Cronometro-->
        <div id="tela-cronometro" class="tela active">
            <div class="display-grande">
                <span id="cronometro-display" class="tempo-display">00:00:00</span>
                <span id="cronometro-ms" class="milisegundos">.000</span>
            </div>

            <div class="controles">
                <button id="btn-cronometro-start" class="btn btn-success btn-large"> Iniciar </button>
                <button id="btn-cronometro-pause" class="btn btn-warning btn-large" style="display:none;">
                    ⏸️ Pausar
                </button>
                <button id="btn-cronometro-lap" class="btn btn-secondary" style="display:none;"></button>
                <button id="btn-cronometro-reset" class="btn btn-danger">Zerar</button>
            </div>

            <div class="laps-contaniner">
                <h3>Voltas</h3>
                <div id="laps-lista" class="laps-lista"></div>
            </div>
        </div>

        <!--Tela Timer-->

        <div id="tela-timer" class="tela">
            <div class="timer-setup">
                <h3>Configurar Timer</h3>
                <div class="timer-inputs">
                    <div class="timer--input-group">
                        <label>Horas</label>
                        <input type="number" id="timer-minutes" min="0" max="23" value="0">
                    </div>
                    <div class="time-input-group">
                        <label>Minutos</label>
                        <input type="number" id="timer-minutes" min="0" max="59" value="5">
                    </div>
                    <div class="time-input-group">
                        <label>Segundos</label>
                        <input type="number" id="timer-seconds" min="0" max="59" value="0">
                    </div>
                </div>

                <div class="presets">
                    <button class="btn-preset" data-seconds="60">1 min</button>
                    <button class="btn-preset" data-seconds="300">5 min</button>
                    <button class="btn-preset" data-seconds="600">10 min</button>
                    <button class="btn-preset" data-seconds="900">15 min</button>
                    <button class="btn-preset" data-seconds="1000">30 min</button>
                </div>
            </div>

            <div class="display-grande">
                <span id="timer-display" class="tempo-display">00:05:00</span>
            </div>

            <div class="progress-circle">
                <svg class="progress-ring" width="200" height="200">
                    <circle class="progress-ring-bg" cx="100" cy="100" r="90"></circle>
                    <circle id="progress-ring-circle" class="progress-ring-circle" cx="100" cy="100" r="90"></circle>
                </svg>
            </div>

            <div class="controles">
                <button id="btn-timer-start" class="btn btn-sucess btn-large">Iniciar</button>
                <button id="btn-timer-pause" class="btn btn-warning btn-large">Pausar</button>
                <button id="btn-timer-reset" class="btn btn-danger">Zerar</button>
            </div>
        </div>

        <!--Tela pomodoro-->
    </div>
</body>
</html>
