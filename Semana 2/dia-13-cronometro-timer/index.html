<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timer Pro</title>
</head>
<body>
    <div class="container">
        <!--Header-->
        <header class="header">
            <h1>Timer Pro</h1>
            <div class="header-controls">
                <button id="btn-theme" class="btn-icon" title="Alternar Tema">🌙</button>
                <button id="btn-notif" class="btn-icon" title="Ativar notificações">🔔</button>
            </div>
        </header>

        <!--Tabs-->

        <div class="tabs">
            <button class="tab active" data-tab="cronometro">⏱️ Cronômetro</button>
            <button class="tab" data-tab="timer">⏲️ Timer</button>
            <button class="tab" data-tab="pomodoro">🍅 Pomodoro</button>
            <button class="tab" data-tab="relogio">🌍 Relógio</button>
        </div>

        <!--Tela Cronometro-->
        <div id="tela-cronometro" class="tela active">
            <div class="display-grande">
                <span id="cronometro-display" class="tempo-display">00:00:00</span>
                <span id="cronometro-ms" class="milisegundos">.000</span>
            </div>

            <div class="controles">
                <button id="btn-cronometro-start" class="btn btn-success btn-large"> Iniciar </button>
                <button id="btn-cronometro-pause" class="btn btn-warning btn-large" style="display:none;">
                    ⏸️ Pausar
                </button>
                <button id="btn-cronometro-lap" class="btn btn-secondary" style="display:none;"></button>
                <button id="btn-cronometro-reset" class="btn btn-danger">Zerar</button>
            </div>

            <div class="laps-contaniner">
                <h3>Voltas</h3>
                <div id="laps-lista" class="laps-lista"></div>
            </div>
        </div>

        <!--Tela Timer-->



    </div>
</body>
</html>
